name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Generate and validate a small sample
        run: |
          python -m generator --out sample --days 2 --min-rows-per-day 5000 --max-rows-per-day 5000
          python -m generator.validate --out sample
